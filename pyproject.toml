# Inference environment for mobile-manip: Python 3.12, Linux x86_64, CUDA 12.4 wheels from PyPI.
[project]
name = "fast-foundationstereo"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "xformers==0.0.29.post3",
    "timm==1.0.30",
    "einops==0.8.2",
    "omegaconf==2.3.1",
    "scipy==1.18.1",
    "numpy==2.5.3",
    "scikit-image==0.26.0",
    "opencv-contrib-python==5.0.0.93",
    "imageio==2.38.0",
    "pyyaml==6.0.3",
    "open3d==0.20.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
